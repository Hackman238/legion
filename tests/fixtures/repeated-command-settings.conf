[GeneralSettings]
default-terminal=xterm

[PortActions]
nikto=Run nikto, "(command -v nikto >/dev/null 2>&1 && nikto -nointeractive -Format xml -output old.xml -nointeractive -host https://example.test:8443 -NoInteractive -C all) || echo nikto not found", "http,https"
wpscan=Run wpscan, "(command -v wpscan >/dev/null 2>&1 && (wpscan --disable-tls-checks --no-update --format json --output [OUTPUT].json --url [WEB_URL] || wpscan --disable-tls-checks --no-update --format json --output [OUTPUT].json --url [WEB_URL] || echo wpscan --disable-tls-checks --no-update --format json --output [OUTPUT].json --url [WEB_URL] not found", "http,https"
